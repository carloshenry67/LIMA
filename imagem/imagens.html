<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imagens</title>
</head>
<body>
     <!--title: legenda da foto-->
     <!--alt: texto alternativo para a imagem-->
     <!--draggable: controla se a imagem pode ser arrastada-->
     <!--loading: controla o carregamento da imagem-->
     <!--src: caminho da imagem-->
    <img 
    src="https://files.meiobit.com/wp-content/uploads/2015/10/20151013coringa.jpg"
     alt="coringa do mal"
     loading="lazy"
     title="coringa do mal" 
     draggable="false">
</body>
</html>
