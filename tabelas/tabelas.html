<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <!-- Tabelas html-->
<table border = "50">  <!-- Estrutura de tabela -->

    <thead> <!-- Cabeçalho da tabela -->
        <tr><!--Linha do cabeçalho-->
            <th>Pos</th>
            <th>Piloto</th>
            <th>Pontos</th>
            <th>Pódios</th>
            <th>Vitórias</th>
        </tr>
    </thead>
    
        <tbody> <!-- Corpo da tabela -->
            <tr>
                <td>1</td> <!--Dado da tabela-->
                <td>Antonelli</td>
                <td>215</td>
                <td>3</td>
                <td>2</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Mixel</td>
                <td>200</td>
                <td>2</td>
                <td>1</td>
            </tr>

        </tbody>

    

</table>
</body>
</html>
